version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sutl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sutl
      POSTGRES_PASSWORD: sutl_dev_password
      POSTGRES_DB: sutl_db
    ports:
      - "5433:5432"
    volumes:
      - sutl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutl -d sutl_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sutl_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sutl_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  sutl_postgres_data:
