name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sutl
          POSTGRES_PASSWORD: sutl_ci_password
          POSTGRES_DB: sutl_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sutl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sutl:sutl_ci_password@localhost:5432/sutl_db?schema=public
      DIRECT_URL: postgresql://sutl:sutl_ci_password@localhost:5432/sutl_db?schema=public
      MONGO_URI: mongodb://localhost:27017/sutl_tracking
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3002
      PORT: 3001
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npx prisma db seed

      - run: npm run lint -- --max-warnings=1

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm test

      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          CI: 'true'
